
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0F1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>CrisisSight | EMERGENCY SOS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0F1115;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }
    .leaflet-container {
      width: 100%;
      height: 100%;
      background: #0f1115;
    }
    
    /* Advanced Custom Marker Styling */
    .custom-advanced-marker {
      background: transparent !important;
      border: none !important;
    }
    .marker-pin-wrapper {
      position: relative;
      width: 40px;
      height: 40px;
    }
    .marker-pin-body {
      position: absolute;
      top: 0;
      left: 0;
      width: 40px;
      height: 40px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      z-index: 2;
    }
    .marker-pin-body svg {
      transform: rotate(45deg);
      color: white;
    }
    .marker-pin-pulse {
      position: absolute;
      top: -10px;
      left: -10px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      opacity: 0.2;
      animation: pin-pulse 2s infinite ease-out;
      z-index: 1;
    }
    @keyframes pin-pulse {
      0% { transform: scale(0.5); opacity: 0.8; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    /* Custom InfoWindow (Popup) Styling */
    .leaflet-popup-content-wrapper {
      background: #1e293b !important;
      color: white !important;
      border: 1px solid #334155 !important;
      border-radius: 24px !important;
      padding: 0 !important;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important;
    }
    .leaflet-popup-tip {
      background: #1e293b !important;
      border: 1px solid #334155 !important;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      width: 240px !important;
    }
    .custom-infowindow .header-red {
      background: #dc2626;
      padding: 10px 16px;
      font-weight: 900;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .custom-infowindow .header-blue {
      background: #2563eb;
      padding: 10px 16px;
      font-weight: 900;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .custom-infowindow .body {
      padding: 16px;
    }
    .custom-infowindow .body p {
      margin: 0;
      font-size: 12px;
      font-weight: 600;
      opacity: 0.8;
      line-height: 1.4;
    }
    .custom-infowindow .coords {
      font-family: monospace;
      font-size: 9px !important;
      margin-top: 8px !important;
      opacity: 0.4 !important;
    }
    .custom-infowindow .type-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 8px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .custom-infowindow .nav-link {
      display: block;
      margin-top: 12px;
      background: white;
      color: black;
      text-align: center;
      padding: 8px;
      border-radius: 8px;
      font-size: 9px;
      font-weight: 900;
      text-decoration: none;
      letter-spacing: 0.05em;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      display: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      display: block;
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 10px;
    }
  </style>
